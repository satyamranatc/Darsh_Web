<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Deep Space Black Background -->
  <rect width="1200" height="630" fill="#000000" />
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Top Horizon Specular Line -->
  <line x1="200" y1="90" x2="1000" y2="90" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />

  <!-- Logo Mark -->
  <g transform="translate(100, 110)">
    <rect width="56" height="56" rx="14" fill="#000000" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
    <text x="28" y="38" font-family="-apple-system, Inter, sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF" text-anchor="middle">D</text>
    <text x="75" y="38" font-family="-apple-system, Inter, sans-serif" font-weight="bold" font-size="32" fill="#FFFFFF">Darsh</text>
    <rect x="185" y="16" width="70" height="26" rx="13" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <circle cx="200" cy="29" r="4" fill="#10B981" />
    <text x="212" y="33" font-family="monospace" font-size="12" fill="#A1A1AA">v2.0.1</text>
  </g>

  <!-- Monumental Heading -->
  <text x="100" y="270" font-family="-apple-system, Inter, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="76" letter-spacing="-3" fill="#FFFFFF">
    Clean data.
  </text>
  <text x="100" y="355" font-family="-apple-system, Inter, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="76" letter-spacing="-3" fill="url(#textGrad)">
    Calm charts.
  </text>

  <!-- Subtitle -->
  <text x="100" y="425" font-family="-apple-system, Inter, sans-serif" font-size="24" fill="#94A3B8">
    The modern Pythonic charting and reactive dashboard engine.
  </text>
  <text x="100" y="460" font-family="-apple-system, Inter, sans-serif" font-size="22" fill="#64748B">
    Effortless 1-liners on pandas, matplotlib, and plotly with zero proprietary silos.
  </text>

  <!-- Bottom Badges -->
  <g transform="translate(100, 520)">
    <rect width="210" height="42" rx="21" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="105" y="26" font-family="monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">pip install darsh</text>

    <g transform="translate(230, 0)">
      <rect width="210" height="42" rx="21" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
      <text x="105" y="26" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="600" fill="#818CF8" text-anchor="middle">https://darshdata.in</text>
    </g>
  </g>
</svg>
